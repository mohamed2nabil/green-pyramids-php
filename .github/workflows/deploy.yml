name: Deploy to cPanel via LFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files via LFTP
        run: |
          sudo apt-get update
          sudo apt-get install lftp -y
          lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 10;
          set net:max-retries 2;
          open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
          mirror -Rnev ./ / --ignore-time --parallel=5 --exclude-glob .git* --exclude .github/
          "